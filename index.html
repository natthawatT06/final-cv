<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบคลังข้อสอบ & แบบฝึกทบทวน (Exam Review Hub)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --border-focus: #94a3b8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --success: #10b981;
      --success-soft: #ecfdf5;
      --success-border: #a7f3d0;
      --danger: #ef4444;
      --danger-soft: #fef2f2;
      --danger-border: #fecaca;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -4px rgba(0, 0, 0, 0.02);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Prompt', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--text-main);
      color: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }

    .brand-text h1 {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Course Tabs Bar */
    .nav-bar {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-bar::-webkit-scrollbar {
      display: none;
    }

    .nav-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-pill {
      background: transparent;
      border: 1px solid transparent;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .tab-pill:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }

    .tab-pill.active {
      background: var(--text-main);
      color: #ffffff;
      font-weight: 600;
    }

    .tab-pill .count {
      font-size: 11px;
      opacity: 0.8;
      margin-left: 4px;
      background: rgba(0, 0, 0, 0.08);
      padding: 2px 6px;
      border-radius: 10px;
    }

    .tab-pill.active .count {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Main Container */
    main {
      max-width: 960px;
      width: 100%;
      margin: 24px auto;
      padding: 0 20px;
      flex: 1;
    }

    /* Controls & Filter Bar */
    .toolbar {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .segment-control {
      display: inline-flex;
      background: #f1f5f9;
      padding: 3px;
      border-radius: var(--radius-sm);
    }

    .segment-btn {
      border: none;
      background: transparent;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .segment-btn.active {
      background: #ffffff;
      color: var(--text-main);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .tool-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .tool-btn:hover {
      background: #f8fafc;
      border-color: var(--border-focus);
    }

    .tool-btn.active {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1d4ed8;
      font-weight: 600;
    }

    /* Progress Status */
    .progress-bar-container {
      background: #e2e8f0;
      border-radius: 10px;
      height: 6px;
      width: 100%;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar-fill {
      background: var(--text-main);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }

    .stat-badge.green { color: #059669; }
    .stat-badge.red { color: #dc2626; }

    /* Question Card */
    .question-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .question-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 12px;
    }

    .q-category {
      background: #f1f5f9;
      color: var(--text-muted);
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 500;
    }

    .q-num {
      color: var(--text-subtle);
      font-weight: 600;
      font-size: 13px;
    }

    .q-text {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    .q-image-box {
      margin-bottom: 20px;
      text-align: center;
      background: #f8fafc;
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .q-image-box img {
      max-width: 100%;
      max-height: 380px;
      border-radius: var(--radius-sm);
      object-fit: contain;
    }

    /* Choices */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      text-align: left;
      font-size: 15px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: all 0.15s ease;
      font-family: inherit;
      line-height: 1.5;
    }

    .choice-btn:hover:not(:disabled) {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .choice-marker {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 50%;
      border: 1.5px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 1px;
      transition: all 0.15s ease;
    }

    .choice-text {
      flex: 1;
    }

    /* Choice States */
    .choice-btn.selected {
      border-color: var(--text-main);
      background: #f8fafc;
    }

    .choice-btn.selected .choice-marker {
      border-color: var(--text-main);
      background: var(--text-main);
      color: #ffffff;
    }

    /* Practice Mode Answer Feedback */
    .choice-btn.correct {
      border-color: var(--success);
      background: var(--success-soft);
      color: #065f46;
    }

    .choice-btn.correct .choice-marker {
      border-color: var(--success);
      background: var(--success);
      color: #ffffff;
    }

    .choice-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: #991b1b;
    }

    .choice-btn.wrong .choice-marker {
      border-color: var(--danger);
      background: var(--danger);
      color: #ffffff;
    }

    /* Explanation Box */
    .explanation-box {
      margin-top: 18px;
      padding: 16px 20px;
      border-radius: var(--radius-md);
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--text-main);
      animation: fadeIn 0.25s ease;
    }

    .explanation-box.success {
      background: var(--success-soft);
      border-color: var(--success-border);
      border-left: 4px solid var(--success);
    }

    .explanation-box.danger {
      background: var(--danger-soft);
      border-color: var(--danger-border);
      border-left: 4px solid var(--danger);
    }

    .exp-title {
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .exp-body {
      font-size: 14px;
      color: var(--text-main);
      line-height: 1.55;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Card Navigation Footer */
    .card-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      gap: 12px;
    }

    .nav-btn {
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .nav-btn.primary {
      background: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
    }

    .nav-btn.primary:hover {
      opacity: 0.9;
    }

    /* Question Navigator Drawer / Grid Modal */
    .grid-toggle-btn {
      background: transparent;
      border: none;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
      font-family: inherit;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      max-height: 240px;
      overflow-y: auto;
    }

    .grid-num-btn {
      aspect-ratio: 1;
      border: 1px solid var(--border-color);
      background: #ffffff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
    }

    .grid-num-btn:hover {
      border-color: var(--text-main);
    }

    .grid-num-btn.current {
      background: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
    }

    .grid-num-btn.done-correct {
      background: var(--success-soft);
      border-color: var(--success);
      color: #065f46;
    }

    .grid-num-btn.done-wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: #991b1b;
    }

    /* Meme Popup Styling */
    .meme-popup {
      position: fixed;
      z-index: 999;
      max-width: 260px;
      max-height: 260px;
      border-radius: 14px;
      background: #ffffff;
      padding: 6px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25), 0 8px 10px -6px rgba(0, 0, 0, 0.15);
      border: 3px solid #ffffff;
      pointer-events: auto;
      cursor: pointer;
      animation: memePopIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .meme-popup img {
      width: 100%;
      height: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    .meme-popup.fade-out {
      opacity: 0;
      transform: scale(0.7) translateY(20px) !important;
    }

    @keyframes memePopIn {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(-15deg);
      }
      100% {
        opacity: 1;
      }
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state h3 {
      font-size: 18px;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #ffffff;
      border-radius: var(--radius-lg);
      max-width: 500px;
      width: 100%;
      padding: 32px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      transform: scale(0.96);
      transition: transform 0.2s ease;
    }

    .modal-backdrop.show .modal-box {
      transform: scale(1);
    }

    .modal-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .modal-score {
      font-size: 40px;
      font-weight: 700;
      color: var(--text-main);
      margin: 16px 0;
      letter-spacing: -1px;
    }

    .modal-stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .modal-btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    html, body {
      overflow-x: hidden;
      max-width: 100%;
    }

    /* Enhanced Responsive Design */
    @media (max-width: 768px) {
      .header-inner {
        padding: 10px 14px;
        flex-wrap: wrap;
      }
      .brand-text p {
        display: none;
      }
      .brand-text h1 {
        font-size: 15px;
      }
      .brand-icon {
        width: 32px;
        height: 32px;
        font-size: 14px;
      }
      .header-actions {
        gap: 6px;
      }
      .header-actions .tool-btn {
        padding: 5px 9px;
        font-size: 12px;
      }
      main {
        margin: 14px auto;
        padding: 0 12px;
      }
      .toolbar {
        padding: 12px 10px;
        gap: 10px;
      }
      .toolbar-group {
        width: 100%;
        justify-content: space-between;
      }
      .toolbar-group .segment-control {
        flex: 1;
        display: flex;
      }
      .segment-btn {
        flex: 1;
        justify-content: center;
        padding: 6px 2px;
        font-size: 12px;
      }
      .question-card {
        padding: 18px 14px;
        border-radius: var(--radius-md);
      }
      .q-text {
        font-size: 15px;
        margin-bottom: 16px;
      }
      .choice-btn {
        padding: 12px 12px;
        font-size: 14px;
        gap: 10px;
        border-radius: 10px;
      }
      .choice-marker {
        width: 22px;
        height: 22px;
        min-width: 22px;
        font-size: 11px;
      }
      .card-nav {
        margin-top: 18px;
        gap: 8px;
      }
      .nav-btn {
        padding: 9px 12px;
        font-size: 13px;
      }
      .meme-popup {
        max-width: min(200px, 60vw);
        max-height: 200px;
      }
      .grid-container {
        grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
        gap: 6px;
      }
      .modal-box {
        padding: 24px 16px;
      }
      .modal-score {
        font-size: 32px;
        margin: 12px 0;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">✓</div>
        <div class="brand-text">
          <h1>คลังข้อสอบ & ฝึกทบทวน</h1>
          <p>คัดกรองข้อซ้ำ • เฉลยแม่นยำ • พร้อมคำอธิบาย</p>
        </div>
      </div>
      <div class="header-actions">

        <button class="tool-btn" onclick="shuffleCurrentQuestions()" title="สลับข้อสอบ">
          🔀 สุ่มข้อ
        </button>
        <button class="tool-btn" onclick="resetProgress()" title="เริ่มทำใหม่">
          ↺ ล้างคะแนน
        </button>
      </div>
    </div>
  </header>

  <!-- Course Navigation Pills -->
  <nav class="nav-bar">
    <div class="nav-inner" id="courseNav">
      <!-- Populated by JS -->
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-group">
        <div class="segment-control">
          <button class="segment-btn active" id="btnModePractice" onclick="setMode('practice')">
            💡 เฉลยทันที
          </button>
          <button class="segment-btn" id="btnModeExam" onclick="setMode('exam')">
            ⏱️ โหมดสอบ
          </button>
        </div>

        <div class="segment-control">
          <button class="segment-btn active" id="btnViewCard" onclick="setView('card')">
            ทำทีละข้อ
          </button>
          <button class="segment-btn" id="btnViewList" onclick="setView('list')">
            แสดงทั้งหมด
          </button>
        </div>
      </div>

      <div class="toolbar-group">
        <button class="tool-btn" id="filterWrongBtn" onclick="toggleFilterWrong()">
          ❌ ข้อที่ตอบผิด (<span id="wrongCountLabel">0</span>)
        </button>
        <button class="grid-toggle-btn" id="btnToggleGrid" onclick="toggleGrid()">
          🗺️ แผนผังข้อสอบ
        </button>
      </div>

      <!-- Progress bar -->
      <div style="width: 100%;">
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="stats-row">
          <span id="progressText">ความคืบหน้า: 0 / 0</span>
          <span>
            <span class="stat-badge green">✓ ถูก: <span id="statCorrect">0</span></span>
            &nbsp;•&nbsp;
            <span class="stat-badge red">✗ ผิด: <span id="statWrong">0</span></span>
            &nbsp;•&nbsp;
            <span>แม่นยำ: <strong id="statAccuracy">0%</strong></span>
          </span>
        </div>
      </div>

      <!-- Quick Question Grid Drawer -->
      <div class="grid-container" id="quickGrid" style="display: none; width: 100%;">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Questions Container -->
    <div id="quizContainer">
      <!-- Rendered dynamically -->
    </div>
  </main>

  <!-- Exam Result Modal -->
  <div class="modal-backdrop" id="resultModal">
    <div class="modal-box">
      <div class="modal-icon" id="modalEmoji">🎉</div>
      <h2 class="modal-title" id="modalTitle">ผลการทดสอบ</h2>

    "question": "เหตุใดการสร้างไฟล์ เช่น ไฟล์ภาพ JPG บนโทรศัพท์เคลื่อนที่ สามารถนำไปเปิดในเครื่องอื่นๆ เช่น คอมพิวเตอร์ตั้งโต๊ะ ได้เช่นกัน แม้เครื่องนั้นจะมีสถาปัตยกรรมที่ต่างกัน",
    "images": [],

      "เพราะโปรแกรมอ่านไฟล์เข้าใจข้อตกลงการแทนข้อมูลของไฟล์",

    "images": [

    "category": "แบบทดสอบหลังเรียน",
    "question": "หากกำหนด A = 0 และ B = 1 ตัวเลือกใดเป็นผลลัพธ์ของวงจรต่อไปนี้",
    "images": [

    "explanation": "คำนวณผลลัพธ์ตามสถานะของลอจิกเกตในวงจรดิจิทัล"

</script>
  <script>
    // State
    let allQuestions = window.QUIZ_DATA || [];
    let currentCourse = 'all';
    let currentMode = 'practice'; // 'practice' | 'exam'
    let currentView = 'card';     // 'card' | 'list'
    let currentIndex = 0;
    let onlyWrongFilter = false;
    let memeEnabled = true;

    // Memes List from folder 'm/'
    const MEME_LIST = [
      "m/26622bc94393531874b572085e664301.jpg",
      "m/4c039c3bec8a1bae2b055f72afee9a83.jpg",
      "m/924b035a1af0f59aafce9722fc09a506.jpg",
      "m/README_QUIZZES.jpg",
      "m/e4463f313a2db3c13986bd055927a3ec.jpg",
      "m/images%20%281%29.jpeg",
      "m/images%20%282%29.jpeg",
      "m/images%20%283%29.jpeg",
      "m/images.jpeg",
      "m/wdv7ucomrpt5.jpg"
    ];

    // User responses: question.id -> selectedChoiceIndex
    let userAnswers = {};

    const COURSES = [
      { id: 'all', name: 'ทั้งหมด' },
      { id: 'cv', name: 'Computer Vision' },
      { id: 'python', name: 'Python Programming' },
      { id: 'digital', name: 'Digital Systems' },
      { id: 'aiml', name: 'AI & Machine Learning' }
    ];

    function init() {
      renderCourseTabs();
      updateFilteredQuestions();
      render();
    }



    function triggerRandomMeme() {
      if (!memeEnabled || MEME_LIST.length === 0) return;

      // Pick random meme
      const randomSrc = MEME_LIST[Math.floor(Math.random() * MEME_LIST.length)];

      // Random position on viewport
      const randomTop = Math.floor(Math.random() * 52) + 12; // 12vh to 64vh
      const randomLeft = Math.floor(Math.random() * 58) + 8; // 8vw to 66vw
      const randomRotate = Math.floor(Math.random() * 26) - 13; // -13deg to +13deg

      const popup = document.createElement('div');
      popup.className = 'meme-popup';
      popup.style.top = `${randomTop}vh`;
      popup.style.left = `${randomLeft}vw`;
      popup.style.transform = `rotate(${randomRotate}deg)`;

      popup.innerHTML = `<img src="${randomSrc}" alt="Meme" title="คลิกเพื่อปิดมีมได้เลย">`;

      // Click to dismiss immediately
      popup.onclick = () => {
        popup.classList.add('fade-out');
        setTimeout(() => popup.remove(), 400);
      };

      document.body.appendChild(popup);

      // Auto dismiss after 3 seconds
      setTimeout(() => {
        if (popup.parentElement) {
          popup.classList.add('fade-out');
          setTimeout(() => popup.remove(), 400);
        }
      }, 3000);
    }

    function renderCourseTabs() {
      const nav = document.getElementById('courseNav');
      nav.innerHTML = COURSES.map(c => {
        const count = c.id === 'all' 
          ? allQuestions.length 
          : allQuestions.filter(q => q.course_id === c.id).length;
        const activeClass = c.id === currentCourse ? 'active' : '';
        return `
          <button class="tab-pill ${activeClass}" onclick="selectCourse('${c.id}')">
            ${c.name}
            <span class="count">${count}</span>
          </button>
        `;
      }).join('');
    }

    function selectCourse(cid) {
      currentCourse = cid;
      currentIndex = 0;
      onlyWrongFilter = false;
      document.getElementById('filterWrongBtn').classList.remove('active');
      renderCourseTabs();
      updateFilteredQuestions();
      render();
    }

    function getActiveQuestions() {
      let list = allQuestions;
      if (currentCourse !== 'all') {
        list = list.filter(q => q.course_id === currentCourse);
      }
      if (onlyWrongFilter) {
        list = list.filter(q => userAnswers[q.id] !== undefined && userAnswers[q.id] !== q.correct_index);
      }
      return list;
    }

    function updateFilteredQuestions() {
      const list = getActiveQuestions();
      if (currentIndex >= list.length) currentIndex = Math.max(0, list.length - 1);
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnModePractice').classList.toggle('active', mode === 'practice');
      document.getElementById('btnModeExam').classList.toggle('active', mode === 'exam');
      render();
    }

    function setView(view) {
      currentView = view;
      document.getElementById('btnViewCard').classList.toggle('active', view === 'card');
      document.getElementById('btnViewList').classList.toggle('active', view === 'list');
      render();
    }

    function toggleFilterWrong() {
      onlyWrongFilter = !onlyWrongFilter;
      const btn = document.getElementById('filterWrongBtn');
      btn.style.background = onlyWrongFilter ? '#fee2e2' : '';
      btn.style.borderColor = onlyWrongFilter ? '#ef4444' : '';
      currentIndex = 0;
      updateFilteredQuestions();
      render();
    }

    function toggleGrid() {
      const g = document.getElementById('quickGrid');
      const isHidden = g.style.display === 'none';
      g.style.display = isHidden ? 'grid' : 'none';
      if (isHidden) renderQuickGrid();
    }

    function shuffleCurrentQuestions() {
      // Fisher-Yates shuffle
      for (let i = allQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
      }
      currentIndex = 0;
      render();
    }

    function resetProgress() {
      if (confirm('ต้องการล้างผลคะแนนและคำตอบที่ทำไว้ทั้งหมดใช่หรือไม่?')) {
        userAnswers = {};
        currentIndex = 0;
        onlyWrongFilter = false;
        document.getElementById('filterWrongBtn').style.background = '';
        document.getElementById('filterWrongBtn').style.borderColor = '';
        render();
      }
    }

    function handleSelectChoice(qId, choiceIdx) {
      userAnswers[qId] = choiceIdx;
      updateStats();
      render();
    }

    function updateStats() {
      const activeList = getActiveQuestions();
      const total = activeList.length;
      let answered = 0;
      let correct = 0;
      let wrong = 0;

      activeList.forEach(q => {
        if (userAnswers[q.id] !== undefined) {
          answered++;
          if (userAnswers[q.id] === q.correct_index) correct++;
          else wrong++;
        }
      });

      // Total wrong in system
      let totalWrong = 0;
      allQuestions.forEach(q => {
        if (userAnswers[q.id] !== undefined && userAnswers[q.id] !== q.correct_index) {
          totalWrong++;
        }
      });
      document.getElementById('wrongCountLabel').innerText = totalWrong;

      const pct = total > 0 ? Math.round((answered / total) * 100) : 0;
      const acc = answered > 0 ? Math.round((correct / answered) * 100) : 0;

      document.getElementById('progressBarFill').style.width = `${pct}%`;
      document.getElementById('progressText').innerText = `ทำแล้ว: ${answered} / ${total} (${pct}%)`;
      document.getElementById('statCorrect').innerText = correct;
      document.getElementById('statWrong').innerText = wrong;
      document.getElementById('statAccuracy').innerText = `${acc}%`;
    }

    function renderQuickGrid() {
      const g = document.getElementById('quickGrid');
      const list = getActiveQuestions();
      g.innerHTML = list.map((q, idx) => {
        const ans = userAnswers[q.id];
        let stateClass = '';
        if (idx === currentIndex && currentView === 'card') stateClass = 'current';
        else if (ans !== undefined) {
          stateClass = (ans === q.correct_index) ? 'done-correct' : 'done-wrong';
        }
        return `
          <button class="grid-num-btn ${stateClass}" onclick="goToQuestion(${idx})">
            ${idx + 1}
          </button>
        `;
      }).join('');
    }

    function goToQuestion(idx) {
      currentIndex = idx;
      if (currentView === 'list') {
        const el = document.getElementById(`q-card-${idx}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        render();
      }
    }

    function render() {
      updateStats();
      renderQuickGrid();
      const container = document.getElementById('quizContainer');
      const list = getActiveQuestions();

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>ไม่พบข้อสอบในหมวดนี้</h3>
            <p>ลองเปลี่ยนตัวกรอง หรือคลิกเลือกหมวดวิชาอื่นด้านบน</p>
          </div>
        `;
        return;
      }

      if (currentView === 'card') {
        renderCardView(container, list);
      } else {
        renderListView(container, list);
      }
    }

    function renderCardView(container, list) {
      const q = list[currentIndex];
      const selectedAns = userAnswers[q.id];
      const hasAnswered = selectedAns !== undefined;

      const letters = ['A', 'B', 'C', 'D', 'E'];

      let choicesHtml = q.choices.map((c, i) => {
        let btnClass = 'choice-btn';
        if (selectedAns === i) btnClass += ' selected';

        if (currentMode === 'practice' && hasAnswered) {
          if (i === q.correct_index) btnClass += ' correct';
          else if (selectedAns === i) btnClass += ' wrong';
        }

        return `
          <button class="${btnClass}" onclick="handleSelectChoice(${q.id}, ${i})">
            <span class="choice-marker">${letters[i] || i + 1}</span>
            <span class="choice-text">${c}</span>
          </button>
        `;
      }).join('');

      let imageHtml = '';
      if (q.images && q.images.length > 0) {
        imageHtml = `
          <div class="q-image-box">
            <img src="${q.images[0]}" alt="โจทย์รูปภาพ" loading="lazy">
          </div>
        `;
      }

      let expHtml = '';
      if (currentMode === 'practice' && hasAnswered) {
        const isCorrect = selectedAns === q.correct_index;
        const boxClass = isCorrect ? 'success' : 'danger';
        const titleIcon = isCorrect ? '✓ ถูกต้อง!' : '✗ ตอบผิด (เฉลย)';
        expHtml = `
          <div class="explanation-box ${boxClass}">
            <div class="exp-title">${titleIcon}</div>
            <div class="exp-body">
              <strong>คำตอบที่ถูกต้องคือ:</strong> ${q.choices[q.correct_index]}<br>
              💡 ${q.explanation}
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="question-card">
          <div class="q-meta">
            <span class="q-category">${q.course_name} • ${q.category}</span>
            <span class="q-num">ข้อ ${currentIndex + 1} จาก ${list.length}</span>
          </div>

          <div class="q-text">${q.question}</div>
          ${imageHtml}
          <div class="choices-list">${choicesHtml}</div>
          ${expHtml}

          <div class="card-nav">
            <button class="nav-btn" onclick="prevQuestion()" ${currentIndex === 0 ? 'disabled' : ''}>
              ← ก่อนหน้า
            </button>
            <div style="font-size: 13px; color: var(--text-muted);">
              ข้อ ${currentIndex + 1} / ${list.length}
            </div>
            ${
              currentIndex === list.length - 1 && currentMode === 'exam'
                ? `<button class="nav-btn primary" onclick="submitExam()">ส่งข้อสอบ ✓</button>`
                : `<button class="nav-btn primary" onclick="nextQuestion()" ${currentIndex === list.length - 1 ? 'disabled' : ''}>ถัดไป →</button>`
            }
          </div>
        </div>
      `;
    }

    function renderListView(container, list) {
      const letters = ['A', 'B', 'C', 'D', 'E'];

      let html = list.map((q, idx) => {
        const selectedAns = userAnswers[q.id];
        const hasAnswered = selectedAns !== undefined;

        let choicesHtml = q.choices.map((c, i) => {
          let btnClass = 'choice-btn';
          if (selectedAns === i) btnClass += ' selected';

          if (currentMode === 'practice' && hasAnswered) {
            if (i === q.correct_index) btnClass += ' correct';
            else if (selectedAns === i) btnClass += ' wrong';
          }

          return `
            <button class="${btnClass}" onclick="handleSelectChoice(${q.id}, ${i})">
              <span class="choice-marker">${letters[i] || i + 1}</span>
              <span class="choice-text">${c}</span>
            </button>
          `;
        }).join('');

        let imageHtml = '';
        if (q.images && q.images.length > 0) {
          imageHtml = `
            <div class="q-image-box">
              <img src="${q.images[0]}" alt="โจทย์รูปภาพ" loading="lazy">
            </div>
          `;
        }

        let expHtml = '';
        if (currentMode === 'practice' && hasAnswered) {
          const isCorrect = selectedAns === q.correct_index;
          const boxClass = isCorrect ? 'success' : 'danger';
          const titleIcon = isCorrect ? '✓ ถูกต้อง!' : '✗ ตอบผิด (เฉลย)';
          expHtml = `
            <div class="explanation-box ${boxClass}">
              <div class="exp-title">${titleIcon}</div>
              <div class="exp-body">
                <strong>คำตอบที่ถูกต้องคือ:</strong> ${q.choices[q.correct_index]}<br>
                💡 ${q.explanation}
              </div>
            </div>
          `;
        }

        return `
          <div class="question-card" id="q-card-${idx}">
            <div class="q-meta">
              <span class="q-category">${q.course_name} • ${q.category}</span>
              <span class="q-num">ข้อ ${idx + 1} จาก ${list.length}</span>
            </div>
            <div class="q-text">${q.question}</div>
            ${imageHtml}
            <div class="choices-list">${choicesHtml}</div>
            ${expHtml}
          </div>
        `;
      }).join('');

      if (currentMode === 'exam') {
        html += `
          <div style="text-align: center; margin: 30px 0;">
            <button class="nav-btn primary" style="font-size: 16px; padding: 14px 36px;" onclick="submitExam()">
              ส่งข้อสอบตรวจคะแนน ✓
            </button>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        render();
      }
    }

    function nextQuestion() {
      const list = getActiveQuestions();
      if (currentIndex < list.length - 1) {
        currentIndex++;
        render();
        triggerRandomMeme(); // Trigger random meme popup for 3 seconds!
      }
    }

    function submitExam() {
      const list = getActiveQuestions();
      let correct = 0;
      let answered = 0;

      list.forEach(q => {
        if (userAnswers[q.id] !== undefined) {
          answered++;
          if (userAnswers[q.id] === q.correct_index) correct++;
        }
      });

      const total = list.length;
      const wrong = answered - correct;
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

      document.getElementById('modalScore').innerText = `${correct} / ${total}`;
      document.getElementById('modalPercent').innerText = `${pct}%`;
      document.getElementById('modalCorrect').innerText = correct;
      document.getElementById('modalWrong').innerText = wrong;

      if (pct >= 80) document.getElementById('modalEmoji').innerText = '🏆';
      else if (pct >= 50) document.getElementById('modalEmoji').innerText = '👍';
      else document.getElementById('modalEmoji').innerText = '💪';

      document.getElementById('resultModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('resultModal').classList.remove('show');
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (currentView === 'card') {
        if (e.key === 'ArrowRight') nextQuestion();
        else if (e.key === 'ArrowLeft') prevQuestion();
        else if (['1', '2', '3', '4', '5'].includes(e.key)) {
          const list = getActiveQuestions();
          const q = list[currentIndex];
          const choiceIdx = parseInt(e.key) - 1;
          if (q && q.choices[choiceIdx]) {
            handleSelectChoice(q.id, choiceIdx);
          }
        }
      }
    });

    window.onload = init;
  </script>
